name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed `
            --name "BTC-TX-Console" `
            --collect-all PyQt6 `
            --collect-all coincurve `
            --collect-all bit `
            --hidden-import=bit `
            --hidden-import=bit.crypto `
            --hidden-import=bit.format `
            --hidden-import=bit.network `
            --hidden-import=bit.network.services `
            --hidden-import=coincurve `
            --hidden-import=coincurve._cffi_backend `
            --hidden-import=cffi `
            --hidden-import=requests `
            --hidden-import=logging `
            btc_wallet_tool.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTC-TX-Console-win64
          path: dist/BTC-TX-Console.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BTC-TX-Console.exe
          generate_release_notes: true
