name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install PyQt6 bit requests pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "BTC-TX-Console" `
            --icon=icon.ico `
            btc_wallet_tool.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTC-TX-Console-win64
          path: dist/BTC-TX-Console.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BTC-TX-Console.exe
          generate_release_notes: true